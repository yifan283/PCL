name: Build PCL (Windows)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置（Debug 带调试符号，Snapshot 接近发行版）'
        type: choice
        options:
          - Debug
          - Snapshot
        default: Debug
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 显示构建环境
        shell: pwsh
        run: |
          msbuild -version
          dotnet --version
          Get-ChildItem "MeloongCore\Shared" -Name | Select-Object -First 5

      - name: 校验下载限制开关
        shell: pwsh
        run: |
          $line = Select-String -Path "Plain Craft Launcher 2\Modules\ModSecret.vb" -Pattern "RestrictMcDownload As Boolean"
          Write-Host $line.Line.Trim()
          if ($line.Line -notmatch "=\s*False") { Write-Error "RestrictMcDownload 不是 False，构建终止"; exit 1 }

      - name: 编译
        shell: pwsh
        run: |
          $config = "${{ inputs.configuration }}"
          if ([string]::IsNullOrWhiteSpace($config)) { $config = "Debug" }
          Write-Host "Configuration = $config"
          msbuild "Plain Craft Launcher 2.sln" /restore /m /v:m `
            /p:Configuration=$config `
            /p:Platform="Any CPU" `
            /bl:build.binlog

      - name: 收集产物
        if: always()
        shell: pwsh
        run: |
          $out = "Plain Craft Launcher 2\bin"
          if (Test-Path $out) { Get-ChildItem $out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize }
          else { Write-Warning "输出目录不存在：$out" }

      - name: 上传 exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PCL-${{ inputs.configuration || 'Debug' }}-${{ github.sha }}
          path: |
            Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe
            Plain Craft Launcher 2/bin/Plain Craft Launcher 2.pdb
          if-no-files-found: error

      - name: 上传构建日志（失败时）
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            build.binlog
            **/*.log
          if-no-files-found: ignore
